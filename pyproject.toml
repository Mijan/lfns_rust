# Python environment for the notebooks. The Rust crates are the product;
# this file only describes how to build their Python bindings and which
# plotting packages the notebooks use.
[project]
name = "lfns-notebooks"
version = "0.0.0"
description = "Notebooks illustrating the lfns and dpgmm crates"
requires-python = ">=3.12"
dependencies = [
    "antimony",
    "dpgmm",
    "jupyterlab",
    "lfns",
    "matplotlib",
    "numpy",
    "scipy",
]

[tool.uv]
package = false

[tool.uv.sources]
dpgmm = { path = "crates/dpgmm-py" }
lfns = { path = "crates/lfns-py" }
