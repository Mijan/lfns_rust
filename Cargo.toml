[workspace]
resolver = "3"
members = ["crates/lfns"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Field prefixes such as `log_` state the unit of a value and are kept.
struct_field_names = "allow"

# Tuned for run time over compile time: whole-program inlining across crates.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
