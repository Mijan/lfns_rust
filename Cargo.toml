[package]
name = "lfns"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Likelihood-free nested sampling"
license = "MIT"
readme = "README.md"

[dependencies]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Tuned for run time over compile time: whole-program inlining across crates.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
